<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07051a">
<title>10.A LOADING</title>
<link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<style>
:root{--pink:#ff2bd6;--cyan:#27f3ff;--yellow:#ffd91a;--bg:#07051a;--px:'Press Start 2P',monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:var(--px);font-size:10px;line-height:1.6;overscroll-behavior:none}
.pix{image-rendering:pixelated}
button,input{font-family:var(--px);color:#fff}
.pg{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;background:var(--bg)}
.pg.on{display:flex}
#main{display:none;position:relative;min-height:100vh;padding-bottom:80px}
#main.on{display:block}
.grid{position:fixed;inset:0;z-index:-1;background:linear-gradient(transparent 55%,rgba(255,43,214,.3)),repeating-linear-gradient(90deg,rgba(39,243,255,.22) 0 2px,transparent 2px 40px),repeating-linear-gradient(0deg,rgba(39,243,255,.22) 0 2px,transparent 2px 40px),radial-gradient(ellipse at 50% 0,#2e0b66,var(--bg) 70%);animation:g 3s linear infinite}
@keyframes g{to{background-position:0 0,0 0,0 40px,0 0}}
/* loader */
#bar{width:min(72vw,300px);height:24px;border:3px solid var(--cyan);padding:3px;margin-top:28px;box-shadow:0 0 14px var(--cyan)}
#bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--pink) 0 10px,transparent 10px 13px)}
#ld img{width:min(62vw,260px);filter:drop-shadow(0 0 18px var(--pink))}
.blink{animation:b 1s steps(2) infinite}@keyframes b{50%{opacity:0}}
/* dialog */
.box{width:min(92vw,420px);border:4px solid var(--pink);box-shadow:6px 6px 0 var(--cyan);background:#0d0a2c;padding:16px;margin-top:14px}
#say{min-height:80px;font-size:11px;line-height:1.9}
#nm{display:none;width:100%;margin:10px 0 0;padding:12px;background:#000;border:3px solid var(--cyan);font-size:13px;text-align:center;outline:0}
.btn{margin-top:16px;padding:13px 18px;background:var(--pink);border:3px solid var(--cyan);box-shadow:4px 4px 0 #000;font-size:11px;cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
#dir .sp{height:170px;animation:bob 1.2s steps(2) infinite}@keyframes bob{50%{transform:translateY(-5px)}}
/* banner */
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:rgba(7,5,26,.94);border-bottom:3px solid var(--pink);box-shadow:0 3px 0 var(--cyan)}
#pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--cyan);font-size:11px}
.rt{display:flex;align-items:center;gap:8px;flex-shrink:0}
#tk{color:var(--yellow);font-size:12px;min-width:2ch;text-align:right}
#tb{background:none;border:0;padding:0;cursor:pointer}#tb img{width:30px;height:30px;display:block}
.pulse{animation:p .6s steps(2) infinite}@keyframes p{50%{transform:scale(1.35)}}
h1{margin:26px 0 4px;text-align:center;font-size:19px;color:var(--pink);text-shadow:3px 3px 0 var(--cyan),0 0 18px var(--pink)}
.sub{text-align:center;color:var(--yellow)}
#gl{display:flex;flex-direction:column;gap:22px;padding:22px 16px;max-width:460px;margin:0 auto}
.card{display:block;color:#fff;text-decoration:none;border:4px solid var(--pink);box-shadow:6px 6px 0 var(--cyan),0 0 20px rgba(255,43,214,.5);background:#0d0a2c}
.card:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--cyan)}
.card img{display:block;width:100%;aspect-ratio:8/5;border-bottom:4px solid var(--pink)}
.ct{padding:12px}.ct b{display:block;font-size:13px;color:var(--yellow);margin-bottom:6px}.ct small{display:block;font-size:8px;color:#b9b3ff;margin-bottom:8px}.ct span{color:var(--cyan)}.ct em{font-style:normal}
#mu{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;padding:8px;font-size:8px;background:#000;border:2px solid var(--cyan);cursor:pointer}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.82);text-align:center}
.ov.on{display:flex}.ov .box{margin:0}
.pb{height:18px;border:3px solid var(--cyan);padding:2px;margin:10px 0 14px}.pb i{display:block;height:100%;width:0;background:var(--pink)}
.row{display:flex;align-items:center;gap:14px;width:100%;margin:8px 0;padding:10px;background:#000;border:3px solid #333;text-align:left;font-size:11px;cursor:pointer}
.row:not(:disabled){border-color:var(--yellow)}.row:disabled{opacity:.55;cursor:default}.row small{display:block;margin-top:5px;font-size:8px;color:var(--cyan)}
#qb{margin:14px 0;font-size:9px;word-break:break-all}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;width:min(92vw,400px);padding:12px;background:var(--yellow);color:#000;border:3px solid #000;font-size:9px;text-align:center;display:none}
/* easter egg */
#eg{z-index:40;background:#000;opacity:0;transition:opacity 1.2s;flex-direction:column;font-family:'Courier New',monospace;color:#3f6;font-size:15px;line-height:1.5;text-align:left;justify-content:center}
#eg.on{opacity:1}
#eg canvas{position:absolute;inset:0;opacity:.4}
#eg>*:not(canvas){position:relative}
#eg .in{width:min(92vw,460px);margin:auto}
#eg img{display:block;width:min(60vw,230px);margin:0 auto 14px;border:2px solid #3f6;box-shadow:0 0 20px #3f6;opacity:0;transition:opacity 1.5s}
#eg img.on{opacity:1}
#et{min-height:150px;background:rgba(0,10,0,.7);padding:10px;white-space:pre-wrap}
#ef{display:none;margin-top:10px;font:italic 21px Georgia,serif;color:#fff;text-align:center;text-shadow:0 0 10px #3f6}
#cp{display:none;margin:14px auto 0;font-size:9px;padding:10px 12px;background:#000;border:2px solid #3f6;color:#3f6;cursor:pointer}
#eg #bk{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:14px;z-index:3;font:28px 'Courier New',monospace;background:none;border:2px solid #3f6;color:#3f6;padding:2px 12px;cursor:pointer}
</style>
</head>
<body>
<!--
SHARED SAVE (localStorage key "a10_save") - used by index.html and every game page:
{"name":"","tokens":0,"seen":0,"mute":0,"best":{"eagle":0,"fight":0,"dot":0}}
A game adds earned tokens to .tokens and raises .best[id] if its all-time best was beaten
(keep the other fields untouched), then links back to ../index.html. Game pages: games/eagle.html, games/fight.html, games/dot.html
Assets used: assets/logo.png director.png hgzs.jpg hero_*.png cover_*.png (covers may be replaced later without touching this file)
-->
<div class="grid"></div>

<div class="pg on" id="ld"><img src="assets/logo.png" alt="10.A"><div id="bar"><i></i></div><p class="blink" style="margin-top:18px">LOADING...</p></div>

<div class="pg" id="dir"><img class="pix sp" src="assets/director.png" alt=""><div class="box"><div id="say"></div><input id="nm" maxlength="12" autocomplete="off" placeholder="YOUR NAME"><button class="btn" id="ok">OK</button></div></div>

<div id="main">
<header><span id="pn"></span><div class="rt"><img class="pix" id="coin" width="16" height="16" alt=""><b id="tk">0</b><button id="tb" aria-label="Trophies"><img class="pix" id="ti" alt=""></button></div></header>
<h1>10.A LOADING</h1><p class="sub blink">INSERT COIN</p>
<div id="gl"></div>
</div>
<button id="mu">SND: ON</button>

<div class="ov" id="tm"><div class="box" style="width:min(92vw,420px)"><div style="font-size:14px;color:var(--yellow)">TROPHIES</div><p id="tp" style="font-size:9px"></p><div class="pb"><i id="tpb"></i></div><div id="tl"></div><button class="btn" data-x="tm">CLOSE</button></div></div>
<div class="ov" id="qv" style="z-index:25"><div class="box"><div id="qt" style="color:var(--yellow);font-size:12px"></div><div id="qb"></div><button class="btn" data-x="qv">CLOSE</button></div></div>
<div id="toast"></div>

<div class="ov" id="eg"><canvas id="rn"></canvas><button id="bk" aria-label="Back">&larr;</button>
<div class="in"><img id="hg" class="pix" src="assets/hgzs.jpg" alt=""><div id="et"></div><div id="ef">The game has only just begun.</div><button id="cp">COPY MESSAGE</button></div></div>

<script>
const K='a10_save',IG='10.a_loading_',SWIPES=5;
const EGG_MSG=n=>'"The game has only just begun." - '+n;
const QR={silver:'https://www.youtube.com/watch?v=YAgJ9XugGBo',gold:'',diamond:''};            // <- paste the reward links here
const GRAY=['#555','#777'];
const LV=[{id:'silver',t:'SILVER',n:15,c:['#c9d3e0','#ffffff']},{id:'gold',t:'GOLD',n:50,c:['#ffc400','#fff3a0']},{id:'diamond',t:'DIAMOND',n:100,c:['#2fe6ff','#e8ffff']}];
const GAMES=[{id:'eagle',t:'EAGLE RIDE',d:'Ride the eagle through the gates'},{id:'fight',t:'INTERGALACTIC FIGHT',d:'Blast the incoming junk'},{id:'dot',t:'DOT RUN',d:'Eat the dots, dodge the ghosts'}];
const ASSETS=['logo.png','director.png','hgzs.jpg','cover_eagle.png','cover_fight.png','cover_dot.png','hero_eagle.png','hero_fight.png','hero_dot.png'].map(f=>'assets/'+f);
const $=s=>document.querySelector(s);
const def={name:'',tokens:0,seen:0,mute:0,best:{eagle:0,fight:0,dot:0}};
function load(){let o={};try{o=JSON.parse(localStorage.getItem(K))||{}}catch(e){}const s=Object.assign({},def,o);s.best=Object.assign({},def.best,o.best);return s}
let S=load();const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};

/* ---------- pixel art helper ---------- */
function art(rows,pal,s){const c=document.createElement('canvas');c.width=rows[0].length*s;c.height=rows.length*s;const x=c.getContext('2d');rows.forEach((r,y)=>[...r].forEach((ch,i)=>{if(pal[ch]){x.fillStyle=pal[ch];x.fillRect(i*s,y*s,s,s)}}));return c.toDataURL()}
const CUP=["#.#######.#","#.h######.#","#.h######.#","##.#####.##","..#######..","...#####...","....###....","....###....","....###....","...#####...","..#######.."];
const cup=c=>art(CUP,{'#':c[0],h:c[1]},3);
$('#coin').src=art(["..oooo..",".oyyyyo.","oyyhyyyo","oyyhyyyo","oyyhyyyo","oyyyyyyo",".oyyyyo.","..oooo.."],{o:'#b8860b',y:'#ffd91a',h:'#fff3a0'},2);

/* ---------- audio (generated chiptune) ---------- */
let AC,mt,st=0;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function beep(f,d=.08,t='square',v=.05){if(S.mute)return;try{const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
const N=[[220,261.6,329.6,261.6],[174.6,220,261.6,220],[261.6,329.6,392,329.6],[196,246.9,293.7,246.9]];
function music(){if(mt)return;mt=setInterval(()=>{if(S.mute||document.hidden)return;const c=N[(st>>4)%4];beep(c[st%4]*2,.14,'square',.018);if(st%4===0)beep(c[0]/2,.3,'triangle',.05);st++},170)}
function snd(){$('#mu').textContent='SND: '+(S.mute?'OFF':'ON')}
$('#mu').onclick=()=>{S.mute^=1;save();snd();beep(660,.08)};snd();

/* ---------- helpers ---------- */
function type(el,txt,cb,speed=28){clearInterval(el._t);el.textContent='';let i=0;el._t=setInterval(()=>{el.textContent=txt.slice(0,++i);if(i%3==0)beep(520,.02,'square',.02);if(i>=txt.length){clearInterval(el._t);cb&&cb()}},speed)}
const pages=['ld','dir','main'];
function show(id){pages.forEach(p=>$('#'+p).classList.toggle('on',p===id))}
const mainOn=()=>$('#main').classList.contains('on');
const anyOv=()=>document.querySelector('.ov.on');
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{beep(440,.06);$('#'+b.dataset.x).classList.remove('on')});

/* ---------- loader ---------- */
function preload(){return new Promise(res=>{let n=0;const t0=performance.now(),bar=$('#bar i');ASSETS.forEach(u=>{const i=new Image();i.onload=i.onerror=()=>n++;i.src=u});
(function f(){const t=performance.now()-t0,p=Math.min(t/2200,n/ASSETS.length);bar.style.width=(p*100)+'%';if(p>=1||t>9000){bar.style.width='100%';setTimeout(res,300)}else requestAnimationFrame(f)})()})}

/* ---------- intro ---------- */
function toMain(){show('main');render()}
function intro(){
  show('dir');const say=$('#say'),inp=$('#nm'),ok=$('#ok');
  if(S.name){inp.style.display='none';ok.style.display='inline-block';ok.textContent='CONTINUE';type(say,'Welcome back, '+S.name+'!');ok.onclick=()=>{music();beep(880,.1);toMain()};return}
  ok.style.display='none';
  type(say,"Welcome adventurer! What's your name?",()=>{inp.style.display='block';ok.style.display='inline-block';ok.textContent='OK';inp.focus()});
  const sub=()=>{const n=inp.value.trim().slice(0,12);if(!n){beep(150,.2);inp.focus();return}S.name=n;save();music();beep(880,.1);inp.style.display='none';ok.textContent="LET'S GO";
    type(say,'Follow me! Here you can play three of the greatest games of all time. By playing you can collect tokens and reveal special rewards.');ok.onclick=()=>{beep(990,.1);toMain()}};
  ok.onclick=sub;inp.onkeydown=e=>{if(e.key==='Enter')sub()};
}

/* ---------- main page ---------- */
$('#gl').innerHTML=GAMES.map(g=>`<a class="card" href="games/${g.id}.html"><img class="pix" src="assets/cover_${g.id}.png" alt=""><div class="ct"><b>${g.t}</b><small>${g.d}</small><span>BEST <em id="b-${g.id}">0</em></span></div></a>`).join('');
const lvl=()=>LV.filter(l=>S.tokens>=l.n).length;
function render(){
  $('#pn').textContent=S.name;$('#tk').textContent=S.tokens;
  const L=lvl();$('#ti').src=cup(L?LV[L-1].c:GRAY);
  GAMES.forEach(g=>$('#b-'+g.id).textContent=S.best[g.id]);
  if(L>S.seen){S.seen=L;save();toast(LV[L-1].t+' TROPHY UNLOCKED! TAP THE CUP');$('#tb').classList.add('pulse');beep(1040,.3)}
}
$('#tb').onclick=()=>{$('#tb').classList.remove('pulse');beep(660,.08);openTr()};
function openTr(){
  const L=lvl(),nx=LV[L],prev=L?LV[L-1].n:0;
  $('#tp').textContent=nx?S.tokens+' / '+nx.n+' TOKENS TO '+nx.t:'ALL TROPHIES UNLOCKED!';
  $('#tpb').style.width=nx?Math.min(100,(S.tokens-prev)/(nx.n-prev)*100)+'%':'100%';
  const tl=$('#tl');tl.innerHTML='';
  LV.forEach((l,i)=>{const ok=i<L,r=document.createElement('button');r.className='row';r.disabled=!ok;
    r.innerHTML=`<img class="pix" width="44" height="40" src="${cup(ok?l.c:GRAY)}" alt=""><span>${l.t}<small>${ok?'TAP: REVEAL QR CODE':l.n+' TOKENS NEEDED'}</small></span>`;
    r.onclick=()=>{beep(880,.1);qr(l)};tl.append(r)});
  $('#tm').classList.add('on');
}
function qr(l){
  const b=$('#qb');b.innerHTML='';$('#qt').textContent=l.t+' REWARD';const u=QR[l.id];
  if(!u)b.textContent='REWARD LINK COMING SOON';
  else if(window.QRCode){const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener noreferrer';a.style.cssText='display:inline-block';const w=document.createElement('div');w.style.cssText='background:#fff;padding:12px;display:inline-block';a.append(w);b.append(a);new QRCode(w,{text:u,width:200,height:200})}
  //else if(window.QRCode){const w=document.createElement('div');w.style.cssText='background:#fff;padding:12px;display:inline-block';b.append(w);new QRCode(w,{text:u,width:200,height:200})} CHANGED SO THAT THE CODE CAN BE TOUCHED.
  else b.textContent=u;
  $('#qv').classList.add('on');
}
['pageshow','visibilitychange','focus'].forEach(e=>addEventListener(e,()=>{if(document.hidden)return;S=load();snd();if(mainOn())render()}));
addEventListener('storage',()=>{S=load();if(mainOn())render()});

/* ---------- easter egg: violent swiping / scrolling ---------- */
let T=0,sw=[],wh=[];
function hit(a,win,need){const n=performance.now();while(a.length&&n-a[0]>win)a.shift();a.push(n);if(a.length>=need){a.length=0;egg()}}
addEventListener('touchstart',e=>{T={y:e.touches[0].clientY,t:performance.now()}},{passive:true});
addEventListener('touchend',e=>{if(!T||!mainOn()||anyOv()){T=0;return}const c=e.changedTouches[0],dy=Math.abs(c.clientY-T.y),dt=performance.now()-T.t;T=0;if(dy>90&&dy/dt>.9)hit(sw,3500,SWIPES)},{passive:true});
addEventListener('wheel',e=>{if(mainOn()&&!anyOv()&&Math.abs(e.deltaY)>=100)hit(wh,1200,12)},{passive:true});
let rt;
function rain(c){const x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const k=16,d=Array.from({length:Math.ceil(c.width/k)},()=>Math.random()*-40);
  return setInterval(()=>{x.fillStyle='rgba(0,8,0,.12)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#2f6';x.font=k+'px monospace';d.forEach((y,i)=>{x.fillText(Math.random()<.5?'0':'1',i*k,y*k);d[i]=y*k>c.height&&Math.random()>.975?0:y+1})},60)}
function egg(){
  const e=$('#eg');if(e.classList.contains('on'))return;
  ['tm','qv'].forEach(i=>$('#'+i).classList.remove('on'));
  const t=$('#et'),f=$('#ef'),cp=$('#cp'),h=$('#hg');t.textContent='';f.style.display=cp.style.display='none';h.classList.remove('on');
  e.style.display='flex';void e.offsetWidth;e.classList.add('on');rt=rain($('#rn'));beep(80,.6,'sawtooth',.06);
  setTimeout(()=>{h.classList.add('on');
    const l1="> What are you doing here? You're not supposed to be here!\n";
    const l2="> Hm... Well, if you've come this far, you may as well help me. Deliver my message to @"+IG+" on Instagram:";
    type(t,l1,()=>setTimeout(()=>{const b=l1;let i=0;clearInterval(t._t);t._t=setInterval(()=>{t.textContent=b+'\n'+l2.slice(0,++i);if(i>=l2.length){clearInterval(t._t);setTimeout(()=>{f.style.display='block';cp.style.display='block';beep(300,.4,'triangle',.06)},700)}},30)},500),40)},1300);
}
$('#cp').onclick=()=>{const m=EGG_MSG(S.name||'?');const ok=()=>{$('#cp').textContent='COPIED!';setTimeout(()=>$('#cp').textContent='COPY MESSAGE',1800)};
  if(navigator.clipboard)navigator.clipboard.writeText(m).then(ok,()=>prompt('Copy this message:',m));else prompt('Copy this message:',m)};
$('#bk').onclick=()=>{const e=$('#eg');e.classList.remove('on');clearInterval(rt);clearInterval($('#et')._t);setTimeout(()=>{if(!e.classList.contains('on'))e.style.display='none'},1300)};

/* ---------- start ---------- */
preload().then(intro);
</script>
</body>
</html>
