<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07051a">
<title>EAGLE RIDE</title>
<link rel="icon" href="../assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff2bd6;--cyan:#27f3ff;--yellow:#ffd91a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07051a;overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:'Press Start 2P',monospace;color:#fff;font-size:10px;line-height:1.7;user-select:none;-webkit-user-select:none}
#w{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;touch-action:none;background:#000}
#ex{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:5;padding:8px 10px;font-size:8px;color:#fff;text-decoration:none;background:rgba(0,0,0,.7);border:2px solid var(--cyan)}
#go{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.78);padding:16px;text-align:center}
#go.on{display:flex}
.box{width:min(92vw,380px);border:4px solid var(--pink);box-shadow:6px 6px 0 var(--cyan);background:#0d0a2c;padding:18px}
.box h2{margin:0 0 14px;font-size:16px;color:var(--yellow);text-shadow:2px 2px 0 var(--pink)}
.st{display:flex;justify-content:space-between;margin:8px 0;font-size:10px}.st b{color:var(--cyan)}
.btn{display:block;width:100%;margin-top:12px;padding:13px;background:var(--pink);border:3px solid var(--cyan);box-shadow:4px 4px 0 #000;font:11px 'Press Start 2P',monospace;color:#fff;text-decoration:none;cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}.btn.b2{background:#000}
</style>
</head>
<body>
<!--
EAGLE RIDE - uses the shared save "a10_save" (see index.html): adds tokens live (1 per 10 points) and updates best.eagle.
Tuning: LIVES, SPEED0/SPEED_MAX, GAP0/GAP_MIN, PX_PER_POINT below.
-->
<div id="w"><canvas id="c"></canvas></div>
<a id="ex" href="../index.html">EXIT</a>
<div id="go"><div class="box"><h2>GAME OVER</h2>
<div class="st"><span>POINTS</span><b id="o1">0</b></div><div class="st"><span>TOKENS EARNED</span><b id="o2">0</b></div><div class="st"><span>ALL-TIME BEST</span><b id="o3">0</b></div><div class="st"><span>YOUR TOKENS</span><b id="o4">0</b></div>
<button class="btn" id="again">PLAY AGAIN</button><a class="btn b2" href="../index.html">BACK TO ARCADE</a></div></div>

<script>
const K='a10_save',W=360,H=640,FL=560,EX=90,PW=58;
const LIVES=3,SPEED0=110,SPEED_MAX=215,GAP0=178,GAP_MIN=138,PX_PER_POINT=60;
const cv=document.getElementById('c'),x=cv.getContext('2d');cv.width=W;cv.height=H;x.imageSmoothingEnabled=false;
const $=s=>document.querySelector(s);
function load(){let o={};try{o=JSON.parse(localStorage.getItem(K))||{}}catch(e){}return Object.assign({name:'',tokens:0,seen:0,mute:0},o,{best:Object.assign({eagle:0,fight:0,dot:0},o.best)})}
let S=load();
function upd(f){const s=load();f(s);try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}S=s}
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();

/* audio */
let AC,mt,ms=0;
function beep(f,d=.08,t='square',v=.05){if(S.mute)return;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const NT=[[220,261.6,329.6,392],[196,246.9,293.7,392],[174.6,220,261.6,349.2],[196,246.9,293.7,329.6]];
function music(){if(mt)return;mt=setInterval(()=>{if(S.mute||document.hidden||st!=='play')return;const c=NT[(ms>>4)%4];beep(c[ms%4]*2,.1,'square',.016);if(ms%2===0)beep(c[0]/2,.18,'triangle',.05);ms++},130)}

/* images */
const IM={};let loaded=0;const FILES={up:'eagle_up',dn:'eagle_down',rd:'hero_eagle'};
for(const k in FILES){const i=new Image();i.onload=()=>loaded++;i.src='../assets/'+FILES[k]+'.png';IM[k]=i}

/* state */
let st='ready',t=0,ey,vy,dist,score,tk,lives,inv,pipes,fx,shake;
function reset(){st='ready';ey=260;vy=0;dist=0;score=0;tk=0;lives=LIVES;inv=0;pipes=[];fx=[];shake=0;$('#go').classList.remove('on')}
reset();
function flap(){if(st==='over'||loaded<3)return;if(st==='ready'){st='play';music()}vy=-405;beep(720,.06,'square',.04)}
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap()}});
$('#again').onclick=reset;
function finish(){st='over';upd(s=>{if(score>s.best.eagle)s.best.eagle=score});
  $('#o1').textContent=score;$('#o2').textContent=tk;$('#o3').textContent=S.best.eagle;$('#o4').textContent=S.tokens;
  setTimeout(()=>$('#go').classList.add('on'),600)}
addEventListener('pagehide',()=>{if(st==='play')upd(s=>{if(score>s.best.eagle)s.best.eagle=score})});
function hit(p){
  if(inv>0){if(ey>FL-12){ey=FL-12;vy=-300}return}
  lives--;beep(110,.4,'sawtooth',.07);shake=.3;
  if(lives<=0){beep(70,.7,'sawtooth',.07);return finish()}
  inv=1.6;vy=-240;ey=p?p.gy:FL-70;
}
function update(dt){
  t+=dt;if(shake>0)shake-=dt;
  fx=fx.filter(f=>(f.t-=dt)>0);
  if(st==='ready'){ey=260+Math.sin(t*3)*8;return}
  if(st!=='play')return;
  const sp=Math.min(SPEED_MAX,SPEED0+score*.7),gap=Math.max(GAP_MIN,GAP0-score*.8);
  dist+=sp*dt;vy=Math.min(vy+1250*dt,580);ey+=vy*dt;if(inv>0)inv-=dt;
  pipes.forEach(p=>p.x-=sp*dt);
  while(pipes.length&&pipes[0].x<-PW-10)pipes.shift();
  let last=pipes[pipes.length-1];
  while(!last||last.x<W+20){const g=gap,gy=g/2+70+Math.random()*(FL-g-140);pipes.push({x:last?last.x+215:W+90,gy,g});last=pipes[pipes.length-1]}
  const ns=Math.floor(dist/PX_PER_POINT);
  while(score<ns){score++;
    if(score%10===0){tk++;upd(s=>{s.tokens++});beep(988,.1,'square',.05);setTimeout(()=>beep(1319,.2,'square',.05),90);fx.push({t:1.3,tx:'+1 TOKEN'})}
    else beep(880,.02,'square',.02)}
  if(ey<10){ey=10;vy=Math.max(vy,0)}
  if(ey>FL-12)return hit(null);
  for(const p of pipes){if(EX+22>p.x&&EX-22<p.x+PW&&(ey-10<p.gy-p.g/2||ey+10>p.gy+p.g/2))return hit(p)}
}

/* drawing */
function heart(px,py,c){const r=["01101100","11111110","11111110","01111100","00111000","00010000"];x.fillStyle=c;r.forEach((s,j)=>[...s].forEach((v,i)=>{if(v==='1')x.fillRect(px+i*3,py+j*3,3,3)}))}
function txt(s,px,py,sz,c,al='center'){x.font=sz+'px "Press Start 2P",monospace';x.textAlign=al;x.fillStyle='#000';x.fillText(s,px+2,py+2);x.fillStyle=c;x.fillText(s,px,py)}
function pipe(px,top,h){x.fillStyle='#0d0a2c';x.fillRect(px,top,PW,h);x.fillStyle='#27f3ff';x.fillRect(px,top,3,h);x.fillRect(px+PW-3,top,3,h);x.fillStyle='#ff2bd6';x.fillRect(px+8,top,3,h);x.fillStyle='rgba(39,243,255,.25)';x.fillRect(px+PW-14,top,5,h)}
function cap(px,y,top){x.fillStyle='#0d0a2c';x.fillRect(px-6,y,PW+12,18);x.strokeStyle='#27f3ff';x.lineWidth=3;x.strokeRect(px-4.5,y+1.5,PW+9,15);x.fillStyle='#ff2bd6';x.fillRect(px-6,y+(top?15:0),PW+12,3)}
function bg(){
  let g=x.createLinearGradient(0,0,0,FL);g.addColorStop(0,'#12053a');g.addColorStop(.6,'#7a1b9c');g.addColorStop(1,'#ff2bd6');x.fillStyle=g;x.fillRect(0,0,W,H);
  g=x.createLinearGradient(0,330-70,0,330+70);g.addColorStop(0,'#ffd91a');g.addColorStop(1,'#ff2bd6');x.fillStyle=g;x.beginPath();x.arc(180,370,76,0,7);x.fill();
  x.fillStyle='#7a1b9c';for(let i=0;i<6;i++)x.fillRect(100,385+i*12,160,2+i*1.6);
  x.fillStyle='#1b0a47';x.beginPath();x.moveTo(0,FL);for(let i=0;i<=W;i+=30)x.lineTo(i,FL-30-((i*37)%5)*8-Math.abs(Math.sin(i/55))*20);x.lineTo(W,FL);x.fill();
  x.fillStyle='#0a0620';x.fillRect(0,FL,W,H-FL);x.strokeStyle='#27f3ff';x.lineWidth=2;
  const o=(dist*1.3)%60;for(let i=-8;i<=14;i++){const bx=i*60-o;x.beginPath();x.moveTo(180+(bx-180)*.25,FL);x.lineTo(180+(bx-180)*2.6,H);x.stroke()}
  for(const y of [FL+8,FL+22,FL+44,FL+74]){x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}
  x.fillStyle='#ff2bd6';x.fillRect(0,FL-2,W,4);
}
function draw(){
  x.save();if(shake>0)x.translate((Math.random()-.5)*10,(Math.random()-.5)*10);
  bg();
  for(const p of pipes){const a=p.gy-p.g/2,b=p.gy+p.g/2;pipe(p.x,0,a);cap(p.x,a-18,1);pipe(p.x,b,FL-b);cap(p.x,b,0)}
  if(!(inv>0&&Math.floor(t*14)%2)){
    x.save();x.translate(EX,ey);x.rotate(st==='ready'?0:Math.max(-.45,Math.min(.8,vy/700)));
    const fr=(st==='ready'||vy<-120||Math.floor(t*8)%2)?IM.up:IM.dn;
    if(loaded>=3){x.drawImage(fr,-34,-22,75,45);const rh=54,rw=Math.round(IM.rd.width*rh/IM.rd.height);x.drawImage(IM.rd,-6-rw/2,-rh-4,rw,rh)}
    x.restore()}
  for(const f of fx)txt(f.tx,EX+40,ey-60-(1.3-f.t)*30,10,'#ffd91a','left');
  x.restore();
  txt(String(score),W/2,64,26,'#fff');
  txt('TOKENS +'+tk,W/2,92,9,'#ffd91a');
  for(let i=0;i<LIVES;i++)heart(10+i*30,12,i<lives?'#ff2b5a':'#3a2a4a');
  if(st==='ready'){txt('EAGLE RIDE',W/2,190,22,'#27f3ff');if(Math.floor(t*2)%2)txt('TAP TO FLY',W/2,360,13,'#fff');txt('3 LIVES - 10 POINTS = 1 TOKEN',W/2,610,8,'#b9b3ff')}
}
let last=performance.now();
(function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)})(last);
</script>
</body>
</html>
