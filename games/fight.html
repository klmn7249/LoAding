<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07051a">
<title>INTERGALACTIC FIGHT</title>
<link rel="icon" href="../assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff2bd6;--cyan:#27f3ff;--yellow:#ffd91a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07051a;overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:'Press Start 2P',monospace;color:#fff;font-size:10px;line-height:1.7;user-select:none;-webkit-user-select:none}
#w{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;touch-action:none;background:#000}
#ex{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:5;padding:8px 10px;font-size:8px;color:#fff;text-decoration:none;background:rgba(0,0,0,.7);border:2px solid var(--cyan)}
#go{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.78);padding:16px;text-align:center}
#go.on{display:flex}
.box{width:min(92vw,380px);border:4px solid var(--pink);box-shadow:6px 6px 0 var(--cyan);background:#0d0a2c;padding:18px}
.box h2{margin:0 0 14px;font-size:16px;color:var(--yellow);text-shadow:2px 2px 0 var(--pink)}
.st{display:flex;justify-content:space-between;margin:8px 0;font-size:10px}.st b{color:var(--cyan)}
.btn{display:block;width:100%;margin-top:12px;padding:13px;background:var(--pink);border:3px solid var(--cyan);box-shadow:4px 4px 0 #000;font:11px 'Press Start 2P',monospace;color:#fff;text-decoration:none;cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}.btn.b2{background:#000}
</style>
</head>
<body>
<!--
INTERGALACTIC FIGHT - uses the shared save "a10_save" (see index.html): adds tokens live (1 per 10 points) and updates best.fight.
Points: small object 1, medium 2, large 3 (also when cleared by the mega beam). Tuning: LIVES and the spawn/speed formulas in update().
-->
<div id="w"><canvas id="c"></canvas></div>
<a id="ex" href="../index.html">EXIT</a>
<div id="go"><div class="box"><h2>GAME OVER</h2>
<div class="st"><span>POINTS</span><b id="o1">0</b></div><div class="st"><span>TOKENS EARNED</span><b id="o2">0</b></div><div class="st"><span>ALL-TIME BEST</span><b id="o3">0</b></div><div class="st"><span>YOUR TOKENS</span><b id="o4">0</b></div>
<button class="btn" id="again">PLAY AGAIN</button><a class="btn b2" href="../index.html">BACK TO ARCADE</a></div></div>

<script>
const K='a10_save',W=360,H=640,LIVES=3,FEET=H-26,HH=62,BEAM=1.2;
const cv=document.getElementById('c'),x=cv.getContext('2d');cv.width=W;cv.height=H;x.imageSmoothingEnabled=false;
const $=s=>document.querySelector(s);
function load(){let o={};try{o=JSON.parse(localStorage.getItem(K))||{}}catch(e){}return Object.assign({name:'',tokens:0,seen:0,mute:0},o,{best:Object.assign({eagle:0,fight:0,dot:0},o.best)})}
let S=load();
function upd(f){const s=load();f(s);try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}S=s}
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();

/* audio */
let AC,mt,ms=0;
function beep(f,d=.08,t='square',v=.05){if(S.mute)return;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,AC.currentTime);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const NT=[[146.8,174.6,220,174.6],[130.8,164.8,196,164.8],[116.5,146.8,174.6,146.8],[130.8,164.8,196,220]];
function music(){if(mt)return;mt=setInterval(()=>{if(S.mute||document.hidden||st!=='play')return;const c=NT[(ms>>4)%4];beep(c[ms%4]*2,.09,'square',.014);if(ms%2===0)beep(c[0]/2,.14,'triangle',.05);ms++},120)}

/* graphics */
const hero=new Image();let hl=0;hero.onload=()=>hl=1;hero.src='../assets/hero_fight.png';
function rnd32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rock(r,pal,seed){const n=Math.ceil(2*r/3),c=document.createElement('canvas');c.width=c.height=n;const q=c.getContext('2d'),rn=rnd32(seed),ph=[rn()*6,rn()*6];
  const cr=[0,1,2].map(()=>[rn()*n*.6+n*.2,rn()*n*.6+n*.2,n*(.08+rn()*.1)]);
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){const dx=(i+.5)/n*2-1,dy=(j+.5)/n*2-1,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx),rr=.93-.1*Math.sin(a*3+ph[0])-.07*Math.sin(a*5+ph[1]);if(d>rr)continue;
    let col=d>rr-.22?pal[0]:(dx+dy<-.3?pal[3]:dx+dy>.35?pal[1]:pal[2]);for(const k of cr)if(Math.hypot(i-k[0],j-k[1])<k[2])col=pal[1];q.fillStyle=col;q.fillRect(i,j,1,1)}
  const w=document.createElement('canvas');w.width=w.height=n;const z=w.getContext('2d');z.drawImage(c,0,0);z.globalCompositeOperation='source-in';z.fillStyle='#fff';z.fillRect(0,0,n,n);return{c,w}}
const PAL=[['#2a1a3c','#5a4a78','#7e6ea0','#b3a6d6'],['#3a2210','#6b4424','#8f6234','#c49a5c'],['#102a3a','#2c5a74','#3f82a2','#7fc0dc']];
const TYPES=[{r:11,hp:1,sp:1.15},{r:18,hp:2,sp:1},{r:28,hp:3,sp:.8}];
const ROCK=TYPES.map((ty,i)=>PAL.map((p,j)=>rock(ty.r,p,i*10+j+3)));
const stars=[...Array(70)].map(()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2.2+.4,c:['#fff','#27f3ff','#ff2bd6','#ffd91a'][Math.floor(Math.random()*4)]}));

/* state */
let st='ready',t=0,tm,score,tk,lives,inv,hx,tx,kx,fc,sc,ot,bt,fl,sh,E,B,O,X,F;
function reset(){st='ready';t=0;tm=0;score=0;tk=0;lives=LIVES;inv=0;hx=tx=W/2;kx=0;fc=0;sc=1;ot=14;bt=0;fl=0;sh=0;E=[];B=[];O=[];X=[];F=[];$('#go').classList.remove('on')}
reset();
function addScore(n){for(let i=0;i<n;i++){score++;if(score%10===0){tk++;upd(s=>{s.tokens++});beep(988,.1,'square',.05);setTimeout(()=>beep(1319,.2,'square',.05),90);F.push({t:1.3,tx:'+1 TOKEN',x:hx-34,y:FEET-HH-16})}}}
function finish(){st='over';upd(s=>{if(score>s.best.fight)s.best.fight=score});$('#o1').textContent=score;$('#o2').textContent=tk;$('#o3').textContent=S.best.fight;$('#o4').textContent=S.tokens;setTimeout(()=>$('#go').classList.add('on'),700)}
addEventListener('pagehide',()=>{if(st==='play')upd(s=>{if(score>s.best.fight)s.best.fight=score})});
$('#again').onclick=reset;
function boom(px,py,r,c){X.push({x:px,y:py,r,t:.45,m:.45,c})}
function kill(e,pts){e.dead=1;boom(e.x,e.y,e.ty.r*1.3,e.ty.hp===3?'#ffd91a':'#ff2bd6');if(pts){addScore(e.ty.hp);F.push({t:.7,tx:'+'+e.ty.hp,x:e.x-6,y:e.y-e.ty.r})}beep(e.ty.hp===3?90:160,.2,'sawtooth',.045)}
function megaBeam(){bt=BEAM;fl=.7;sh=.5;beep(200,.9,'sawtooth',.08);setTimeout(()=>beep(400,.7,'sawtooth',.06),150);F.push({t:1.5,tx:'MEGA BEAM!',x:W/2-70,y:H/2});for(const e of E)kill(e,1);E=E.filter(e=>!e.dead)}

/* input */
function px(e){const r=cv.getBoundingClientRect();return(e.clientX-r.left)/r.width*W}
let drag=false;
cv.addEventListener('pointerdown',e=>{e.preventDefault();drag=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}tx=px(e);if(st==='ready'){st='play';music()}});
cv.addEventListener('pointermove',e=>{if(drag)tx=px(e)});
addEventListener('pointerup',()=>drag=false);
addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA'){kx=-1;e.preventDefault()}else if(e.code==='ArrowRight'||e.code==='KeyD'){kx=1;e.preventDefault()}else if(e.code==='Space'&&st==='ready'){st='play';music()}if(st==='ready'&&kx){st='play';music()}});
addEventListener('keyup',e=>{if(['ArrowLeft','KeyA','ArrowRight','KeyD'].includes(e.code))kx=0});

/* update */
function spawn(){
  const k=Math.random(),big=Math.min(.3,.1+tm*.002),mid=.32,ti=k<big?2:k<big+mid?1:0,ty=TYPES[ti];
  const base=Math.min(250,75+tm*1.6)*ty.sp;
  E.push({ty,x:ty.r+4+Math.random()*(W-2*ty.r-8),y:-ty.r,vy:base*(.9+Math.random()*.25),vx:(Math.random()-.5)*60,hp:ty.hp,r:ty.r,im:ROCK[ti][Math.floor(Math.random()*3)],rot:Math.random()*6,sp:(Math.random()-.5)*2,fl:0});
}
function update(dt){
  t+=dt;if(sh>0)sh-=dt;if(fl>0)fl-=dt;
  X=X.filter(e=>(e.t-=dt)>0);F=F.filter(f=>(f.t-=dt)>0);
  if(st!=='play')return;
  tm+=dt;if(inv>0)inv-=dt;
  if(kx)tx=Math.max(14,Math.min(W-14,tx+kx*420*dt));
  const d=tx-hx,m=620*dt;hx+=Math.abs(d)<m?d:Math.sign(d)*m;hx=Math.max(14,Math.min(W-14,hx));
  if(bt>0){bt-=dt}
  fc-=dt;if(fc<=0&&bt<=0){fc=.26;B.push({x:hx,y:FEET-HH+4});beep(1100,.03,'square',.014)}
  sc-=dt;if(bt<=0&&sc<=0){spawn();sc=Math.max(.36,1.15-tm*.013)}
  ot-=dt;if(ot<=0){O.push({x:30+Math.random()*(W-60),y:-20,a:0});ot=24+Math.random()*8}
  B.forEach(b=>b.y-=540*dt);B=B.filter(b=>b.y>-14);
  for(const e of E){e.y+=e.vy*dt;e.x+=e.vx*dt;if(e.x<e.r||e.x>W-e.r)e.vx=-e.vx;e.rot+=e.sp*dt;if(e.fl>0)e.fl-=dt}
  for(const b of B)for(const e of E){if(e.dead||b.dead)continue;if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+3){b.dead=1;e.hp--;e.fl=.08;beep(500,.04,'square',.03);if(e.hp<=0)kill(e,1)}}
  B=B.filter(b=>!b.dead);
  for(const e of E){if(e.dead)continue;if(inv<=0&&Math.hypot(hx-e.x,FEET-30-e.y)<e.r*.85+13){kill(e,0);lives--;inv=1.7;sh=.4;beep(110,.5,'sawtooth',.08);if(lives<=0){beep(70,.8,'sawtooth',.08);E=E.filter(q=>!q.dead);return finish()}}}
  E=E.filter(e=>!e.dead&&e.y<H+50);
  for(const o of O){o.y+=95*dt;o.a+=dt;if(Math.hypot(hx-o.x,FEET-30-o.y)<30){o.dead=1;megaBeam()}}
  O=O.filter(o=>!o.dead&&o.y<H+30);
}

/* drawing */
function heart(px,py,c){const r=["01101100","11111110","11111110","01111100","00111000","00010000"];x.fillStyle=c;r.forEach((s,j)=>[...s].forEach((v,i)=>{if(v==='1')x.fillRect(px+i*3,py+j*3,3,3)}))}
function txt(s,px,py,sz,c,al='center'){x.font=sz+'px "Press Start 2P",monospace';x.textAlign=al;x.fillStyle='#000';x.fillText(s,px+2,py+2);x.fillStyle=c;x.fillText(s,px,py)}
function draw(){
  x.save();if(sh>0)x.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
  let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#06021a');g.addColorStop(.7,'#1d0a4a');g.addColorStop(1,'#5a1280');x.fillStyle=g;x.fillRect(-10,-10,W+20,H+20);
  for(const s of stars){const y=(s.y+t*s.z*22)%H;x.fillStyle=s.c;x.globalAlpha=Math.min(1,.35+s.z*.3);x.fillRect(s.x,y,s.z>1.6?3:2,s.z>1.6?3:2)}x.globalAlpha=1;
  x.strokeStyle='rgba(39,243,255,.25)';x.lineWidth=2;const o=(t*40)%40;for(let y=H-120+o;y<H;y+=40){x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}
  for(const q of O){const r=11+Math.sin(q.a*8)*2;x.fillStyle='rgba(255,217,26,.25)';x.beginPath();x.arc(q.x,q.y,r+8,0,7);x.fill();x.fillStyle=Math.floor(q.a*6)%2?'#ffd91a':'#fff3a0';x.beginPath();x.arc(q.x,q.y,r,0,7);x.fill();x.fillStyle='#ff2bd6';x.fillRect(q.x-2,q.y-8,4,16);x.fillRect(q.x-8,q.y-2,16,4)}
  for(const e of E){x.save();x.translate(e.x,e.y);x.rotate(e.rot);x.drawImage(e.fl>0?e.im.w:e.im.c,-e.r,-e.r,e.r*2,e.r*2);x.restore()}
  for(const b of B){x.fillStyle='#ff2bd6';x.fillRect(b.x-3,b.y,6,16);x.fillStyle='#fff';x.fillRect(b.x-1,b.y,2,14)}
  if(hl&&!(inv>0&&Math.floor(t*14)%2)){x.save();x.translate(hx,FEET);const mv=Math.abs(tx-hx)>3;x.rotate(Math.max(-.14,Math.min(.14,(tx-hx)/250)));if(mv)x.translate(0,-Math.abs(Math.sin(t*16))*2);x.drawImage(hero,-12,-HH,24,HH);x.restore()}
  if(bt>0){const p=1-bt/BEAM,w=90*Math.sin(Math.PI*Math.min(1,p*1.05)),oy=FEET-HH+8;
    for(const [ww,c] of [[w,'rgba(255,43,214,.45)'],[w*.65,'rgba(39,243,255,.7)'],[w*.3,'#fff']]){x.fillStyle=c;x.fillRect(hx-ww/2,0,ww,oy)}
    x.fillStyle='#fff';x.beginPath();x.arc(hx,oy,w*.45,0,7);x.fill()}
  for(const e of X){const p=1-e.t/e.m;for(let i=0;i<8;i++){const a=i*.785+p,r=e.r*p*1.5,s=Math.max(2,6*(1-p));x.fillStyle=i%2?e.c:'#fff';x.globalAlpha=1-p*.7;x.fillRect(e.x+Math.cos(a)*r-s/2,e.y+Math.sin(a)*r-s/2,s,s)}x.globalAlpha=1}
  for(const f of F)txt(f.tx,f.x,f.y-(1.3-Math.min(1.3,f.t))*18,9,'#ffd91a','left');
  if(fl>0){x.fillStyle='rgba(255,255,255,'+Math.min(.7,fl)+')';x.fillRect(-10,-10,W+20,H+20)}
  x.restore();
  txt(String(score),W/2,38,22,'#fff');txt('TOKENS +'+tk,W/2,60,8,'#ffd91a');
  for(let i=0;i<LIVES;i++)heart(10+i*30,12,i<lives?'#ff2b5a':'#3a2a4a');
  if(st==='ready'){txt('INTERGALACTIC',W/2,200,18,'#27f3ff');txt('FIGHT',W/2,236,24,'#ff2bd6');if(Math.floor(t*2)%2)txt('TAP TO START',W/2,340,12,'#fff');txt('DRAG TO MOVE - AUTO FIRE',W/2,380,8,'#b9b3ff');txt('CATCH THE GOLD ORB: MEGA BEAM',W/2,404,7,'#ffd91a')}
  else txt('10 POINTS = 1 TOKEN',W/2,H-6,7,'#b9b3ff');
}
let last=performance.now();
(function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;if(st==='ready')t+=dt;update(dt);draw();requestAnimationFrame(loop)})(last);
</script>
</body>
</html>
