<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07051a">
<title>DOT RUN</title>
<link rel="icon" href="../assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff2bd6;--cyan:#27f3ff;--yellow:#ffd91a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07051a;overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:'Press Start 2P',monospace;color:#fff;font-size:10px;line-height:1.7;user-select:none;-webkit-user-select:none}
#w{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;touch-action:none;background:#000}
#ex{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:5;padding:8px 10px;font-size:8px;color:#fff;text-decoration:none;background:rgba(0,0,0,.7);border:2px solid var(--cyan)}
#go{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.78);padding:16px;text-align:center}
#go.on{display:flex}
.box{width:min(92vw,380px);border:4px solid var(--pink);box-shadow:6px 6px 0 var(--cyan);background:#0d0a2c;padding:18px}
.box h2{margin:0 0 14px;font-size:16px;color:var(--yellow);text-shadow:2px 2px 0 var(--pink)}
.st{display:flex;justify-content:space-between;margin:8px 0;font-size:10px}.st b{color:var(--cyan)}
.btn{display:block;width:100%;margin-top:12px;padding:13px;background:var(--pink);border:3px solid var(--cyan);box-shadow:4px 4px 0 #000;font:11px 'Press Start 2P',monospace;color:#fff;text-decoration:none;cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}.btn.b2{background:#000}
</style>
</head>
<body>
<!--
DOT RUN - uses the shared save "a10_save" (see index.html): adds tokens live (1 per 10 points) and updates best.dot.
Points: dot/power pellet 1, ghost eaten 5, cleared level 10. Tuning: LIVES and the speed formulas in update().
-->
<div id="w"><canvas id="c"></canvas></div>
<a id="ex" href="../index.html">EXIT</a>
<div id="go"><div class="box"><h2>GAME OVER</h2>
<div class="st"><span>POINTS</span><b id="o1">0</b></div><div class="st"><span>TOKENS EARNED</span><b id="o2">0</b></div><div class="st"><span>ALL-TIME BEST</span><b id="o3">0</b></div><div class="st"><span>YOUR TOKENS</span><b id="o4">0</b></div>
<button class="btn" id="again">PLAY AGAIN</button><a class="btn b2" href="../index.html">BACK TO ARCADE</a></div></div>

<script>
const K='a10_save',C=19,R=21,T=20,OY=70,W=380,H=560,LIVES=3;
const MAP=[
"###################",
"#........#........#",
"#o##.###.#.###.##o#",
"#.................#",
"#.##.#.#####.#.##.#",
"#....#...#...#....#",
"####.### # ###.####",
"####.#       #.####",
"####.# ##-## #.####",
"    .  #GGG#  .    ",
"####.# ##### #.####",
"####.#       #.####",
"####.# ##### #.####",
"#........#........#",
"#.##.###.#.###.##.#",
"#o.#.....P.....#.o#",
"##.#.#.#####.#.#.##",
"#....#...#...#....#",
"#.######.#.######.#",
"#.................#",
"###################"];
const cv=document.getElementById('c'),x=cv.getContext('2d');cv.width=W;cv.height=H;x.imageSmoothingEnabled=false;
const $=s=>document.querySelector(s);
function load(){let o={};try{o=JSON.parse(localStorage.getItem(K))||{}}catch(e){}return Object.assign({name:'',tokens:0,seen:0,mute:0},o,{best:Object.assign({eagle:0,fight:0,dot:0},o.best)})}
let S=load();
function upd(f){const s=load();f(s);try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}S=s}
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();

/* audio */
let AC,mt,ms=0;
function beep(f,d=.08,t='square',v=.05){if(S.mute)return;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const NT=[[110,130.8,164.8,130.8],[98,123.5,146.8,123.5],[87.3,110,130.8,110],[98,123.5,146.8,164.8]];
function music(){if(mt)return;mt=setInterval(()=>{if(S.mute||document.hidden||st!=='play')return;const c=NT[(ms>>4)%4];beep(c[ms%4]*2,.1,'square',.014);if(ms%2===0)beep(c[0],.16,'triangle',.05);ms++},150)}

/* graphics */
const hero=new Image();let hl=0;hero.onload=()=>hl=1;hero.src='../assets/hero_dot.png';
const GA=["....######....","..##########..",".############.",".##WW####WW##.",".#WWWW##WWWW#.",".#WWBB##WWBB#.",".##WW####WW##.","##############","##############","##############","##############","##.###..###.##","#...##..##...#"];
function gimg(body,eye,pup,only){const c=document.createElement('canvas');c.width=14;c.height=13;const q=c.getContext('2d');GA.forEach((r,j)=>[...r].forEach((ch,i)=>{const col=ch==='#'?(only?null:body):ch==='W'?eye:ch==='B'?pup:null;if(col){q.fillStyle=col;q.fillRect(i,j,1,1)}}));return c}
const GCOL=['#ff3232','#ff96dc','#28e6f0','#ffa028'];
const GI=GCOL.map(c=>gimg(c,'#fff','#2a2aff')),FI=gimg('#2332e0','#ffe6e6','#2332e0'),WI=gimg('#fff','#e03030','#e03030'),EI=gimg(0,'#fff','#2a2aff',1);
const wc=document.createElement('canvas');wc.width=C*T;wc.height=R*T;
(function(){const w=wc.getContext('2d');for(let y=0;y<R;y++)for(let i=0;i<C;i++){const ch=MAP[y][i];
  if(ch==='#'){w.fillStyle='#0c0c3c';w.fillRect(i*T,y*T,T,T);w.fillStyle='#2f6bff';
    [[0,-1,0,0,T,2],[0,1,0,T-2,T,2],[-1,0,0,0,2,T],[1,0,T-2,0,2,T]].forEach(([dx,dy,a,b,c,d])=>{const nx=i+dx,ny=y+dy;if(ny<0||ny>=R||nx<0||nx>=C||MAP[ny][nx]!=='#')w.fillRect(i*T+a,y*T+b,c,d)})}
  else if(ch==='-'){w.fillStyle='#ff2bd6';w.fillRect(i*T,y*T+T/2-2,T,4)}}})();

/* maze logic */
const walk=(i,y,ok)=>{if(y===9&&(i<0||i>=C))return true;if(i<0||i>=C||y<0||y>=R)return false;const c=MAP[y][i];return c!=='#'&&(c!=='-'||ok)};
const DIRS=[[0,-1],[-1,0],[0,1],[1,0]];
let pel,left,st='ready',t=0,score,tk,lives,level,fr,mode,rdy,dth,P,G,fx,over0;
function newMaze(){pel=MAP.map(r=>[...r].map(c=>c==='.'?1:c==='o'?2:0));left=0;pel.forEach(r=>r.forEach(v=>{if(v)left++}))}
function place(){
  P={x:9,y:15,dx:0,dy:0,p:0,want:[-1,0]};
  const w=Math.max(.5,1-level*.1);
  G=[{x:9,y:7,w:0,s:'norm',c:0,k:[17,1]},{x:9,y:9,w:2*w,s:'house',c:1,k:[1,1]},{x:8,y:9,w:5*w,s:'house',c:2,k:[17,19]},{x:10,y:9,w:8*w,s:'house',c:3,k:[1,19]}].map(g=>Object.assign(g,{dx:0,dy:0,p:0,fright:false}));
  fr=0;rdy=1.6;
}
function reset(){st='ready';t=0;score=0;tk=0;lives=LIVES;level=1;fx=[];mode=0;newMaze();place();$('#go').classList.remove('on')}
reset();
function addScore(n,px,py){for(let i=0;i<n;i++){score++;if(score%10===0){tk++;upd(s=>{s.tokens++});beep(988,.1,'square',.05);setTimeout(()=>beep(1319,.2,'square',.05),90);fx.push({t:1.3,tx:'+1 TOKEN',x:P.x*T,y:OY+P.y*T-24})}}}
function flip(e){if(!e.dx&&!e.dy)return;let nx=e.x+e.dx,ny=e.y+e.dy;if(nx<0)nx=C-1;else if(nx>=C)nx=0;e.x=nx;e.y=ny;e.p=1-e.p;e.dx=-e.dx;e.dy=-e.dy}
function advance(e,d,pick){
  while(d>0){
    if(!e.dx&&!e.dy){const n=pick(e);if(!n){e.p=0;return}e.dx=n[0];e.dy=n[1]}
    const need=1-e.p;if(d<need){e.p+=d;return}
    d-=need;e.x+=e.dx;e.y+=e.dy;e.p=0;if(e.x<0)e.x=C-1;else if(e.x>=C)e.x=0;
    const n=pick(e);if(n){e.dx=n[0];e.dy=n[1]}else{e.dx=e.dy=0}
    if(e.stop){e.stop=0;return}
  }
}
const pPick=e=>{if(walk(e.x+P.want[0],e.y+P.want[1],false))return P.want;if((e.dx||e.dy)&&walk(e.x+e.dx,e.y+e.dy,false))return[e.dx,e.dy];return null};
function target(g){
  const px=P.x,py=P.y,ld=P.ld||[-1,0];
  if(g.s==='eaten')return[9,9];if(g.s==='house')return[9,7];
  if(mode<Math.max(0,5-level)&&!g.fright)return g.k;
  if(g.c===0)return[px,py];
  if(g.c===1)return[px+ld[0]*4,py+ld[1]*4];
  if(g.c===2){const a=px+ld[0]*2,b=py+ld[1]*2;return[2*a-G[0].x,2*b-G[0].y]}
  return(Math.hypot(px-g.x,py-g.y)>8)?[px,py]:g.k;
}
function gPick(g){
  const ok=g.s!=='norm';let o=DIRS.filter(d=>walk(g.x+d[0],g.y+d[1],ok));
  const nr=o.filter(d=>!(g.dx&&d[0]===-g.dx&&d[1]===-g.dy||g.dy&&d[1]===-g.dy&&d[0]===-g.dx));if(nr.length)o=nr;if(!o.length)return null;
  if(g.fright&&g.s==='norm')return o[Math.floor(Math.random()*o.length)];
  const tg=target(g);let b=o[0],bd=1e9;for(const d of o){const dd=(g.x+d[0]-tg[0])**2+(g.y+d[1]-tg[1])**2;if(dd<bd){bd=dd;b=d}}return b;
}
function setWant(d){P.want=d;P.ld=d;if(st==='ready'){st='play';music()}
  if((P.dx||P.dy)&&d[0]===-P.dx&&d[1]===-P.dy&&P.p>0)flip(P)}
function finish(){st='over';upd(s=>{if(score>s.best.dot)s.best.dot=score});$('#o1').textContent=score;$('#o2').textContent=tk;$('#o3').textContent=S.best.dot;$('#o4').textContent=S.tokens;setTimeout(()=>$('#go').classList.add('on'),700)}
addEventListener('pagehide',()=>{if(st==='play')upd(s=>{if(score>s.best.dot)s.best.dot=score})});
$('#again').onclick=reset;

/* input */
let sx,sy,sd=false;
cv.addEventListener('pointerdown',e=>{e.preventDefault();sx=e.clientX;sy=e.clientY;sd=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}if(st==='ready')setWant(P.want)});
cv.addEventListener('pointermove',e=>{if(!sd)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<14)return;
  setWant(Math.abs(dx)>Math.abs(dy)?[dx>0?1:-1,0]:[0,dy>0?1:-1]);sx=e.clientX;sy=e.clientY});
addEventListener('pointerup',()=>sd=false);
const KM={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
addEventListener('keydown',e=>{if(KM[e.code]&&st!=='over'){e.preventDefault();setWant(KM[e.code])}});

/* update */
function update(dt){
  t+=dt;fx=fx.filter(f=>(f.t-=dt)>0);
  if(st==='dying'){dth-=dt;if(dth<=0){lives--;if(lives<=0)finish();else{place();st='play'}}return}
  if(st!=='play')return;
  if(rdy>0){rdy-=dt;return}
  mode=(mode+dt)%20;
  const ps=Math.min(7,6+(level-1)*.2),gs=Math.min(6.4,5.2+(level-1)*.25);
  advance(P,ps*dt,pPick);
  const tx=Math.round(P.x+P.dx*P.p),ty=Math.round(P.y+P.dy*P.p);
  if(pel[ty]&&pel[ty][tx]){const v=pel[ty][tx];pel[ty][tx]=0;left--;addScore(1);beep(Math.floor(t*10)%2?260:330,.04,'square',.035);
    if(v===2){fr=Math.max(2.5,7-level*.8);G.forEach(g=>{if(g.s==='norm'){if(!g.fright)flip(g);g.fright=true}});beep(140,.3,'sawtooth',.05)}}
  if(fr>0){fr-=dt;if(fr<=0)G.forEach(g=>g.fright=false)}
  for(const g of G){
    if(g.s==='house'&&g.w>0){g.w-=dt;continue}
    const sp=g.s==='eaten'?10:g.fright?3.6:gs;
    advance(g,sp*dt,()=>gPick(g));
    if(g.s==='house'&&g.y<=7)g.s='norm';
    if(g.s==='eaten'&&g.x===9&&g.y===9){g.s='house';g.w=1.2;g.dx=g.dy=0;g.p=0}
    if(g.s==='norm'||g.s==='eaten'&&false){
      const gx=g.x+g.dx*g.p,gy=g.y+g.dy*g.p,px=P.x+P.dx*P.p,py=P.y+P.dy*P.p;
      if(Math.hypot(gx-px,gy-py)<.65){
        if(g.fright){g.fright=false;g.s='eaten';g.dx=g.dy=0;g.p=0;addScore(5);beep(600,.12,'square',.05);setTimeout(()=>beep(900,.15,'square',.05),100);fx.push({t:1,tx:'+5',x:gx*T,y:OY+gy*T-20})}
        else{st='dying';dth=1.3;beep(300,.9,'sawtooth',.06);return}
      }}
  }
  if(left<=0){addScore(10);level++;newMaze();place();beep(1200,.3,'square',.05)}
}

/* drawing */
function heart(px,py,c){const r=["01101100","11111110","11111110","01111100","00111000","00010000"];x.fillStyle=c;r.forEach((s,j)=>[...s].forEach((v,i)=>{if(v==='1')x.fillRect(px+i*3,py+j*3,3,3)}))}
function txt(s,px,py,sz,c,al='center'){x.font=sz+'px "Press Start 2P",monospace';x.textAlign=al;x.fillStyle='#000';x.fillText(s,px+2,py+2);x.fillStyle=c;x.fillText(s,px,py)}
function draw(){
  x.fillStyle='#050212';x.fillRect(0,0,W,H);
  x.drawImage(wc,0,OY);
  for(let y=0;y<R;y++)for(let i=0;i<C;i++){const v=pel[y][i];if(!v)continue;const cx=i*T+T/2,cy=OY+y*T+T/2;
    if(v===1){x.fillStyle='#ffd9a8';x.fillRect(cx-2,cy-2,4,4)}
    else{const r=5+Math.sin(t*8)*1.5;x.fillStyle=Math.floor(t*4)%2?'#ffd91a':'#ff2bd6';x.beginPath();x.arc(cx,cy,r,0,7);x.fill()}}
  for(let k=0;k<4;k++){const g=G[k],gx=(g.x+g.dx*g.p)*T+T/2,gy=OY+(g.y+g.dy*g.p)*T+T/2+(g.s==='house'&&g.w>0?Math.sin(t*8+k)*2:0);
    const im=g.s==='eaten'?EI:g.fright?(fr<2&&Math.floor(t*8)%2?WI:FI):GI[g.c];x.drawImage(im,gx-10.5,gy-10,21,20)}
  if(hl){const px=(P.x+P.dx*P.p)*T+T/2,py=OY+(P.y+P.dy*P.p)*T+T/2+10,mv=P.dx||P.dy;
    x.save();x.translate(px,py);
    if(st==='dying'){x.rotate((1.3-dth)*9);x.globalAlpha=Math.max(0,dth/1.3)}
    else{x.rotate(P.dx*.12);if(mv)x.translate(0,-Math.abs(Math.sin(t*16))*2.5)}
    x.drawImage(hero,-7,-34,14,34);x.restore()}
  for(const f of fx)txt(f.tx,f.x,f.y-(1.3-f.t)*20,9,'#ffd91a','left');
  txt(String(score),W/2,38,22,'#fff');txt('TOKENS +'+tk+'   LV '+level,W/2,60,8,'#ffd91a');
  for(let i=0;i<LIVES;i++)heart(10+i*30,12,i<lives?'#ff2b5a':'#3a2a4a');
  if(st==='play'&&rdy>0)txt('READY!',W/2,OY+11*T+6,14,'#ffd91a');
  if(st==='ready'){txt('DOT RUN',W/2,OY+9*T-6,20,'#27f3ff');if(Math.floor(t*2)%2)txt('SWIPE TO START',W/2,OY+11*T+6,10,'#fff')}
  if(fr>0){x.fillStyle='#27f3ff';x.fillRect(40,OY+R*T+22,(W-80)*Math.min(1,fr/7),6)}
  txt('SWIPE TO MOVE - 10 POINTS = 1 TOKEN',W/2,H-24,7,'#b9b3ff');
}
let last=performance.now();
(function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;if(st==='ready')t+=dt;update(dt);draw();requestAnimationFrame(loop)})(last);
</script>
</body>
</html>
